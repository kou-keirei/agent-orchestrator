name: Go

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "backend/**"
      - "cloud/**"
      - "pricing/**"
      - "frontend/src/api/schema.ts"
      - "package.json"
      - ".github/workflows/go.yml"

permissions:
  contents: read

concurrency:
  group: go-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Preserve the existing required check as the gate for every backend test.
  build-test:
    needs: [backend-checks, sqlite-race]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require backend checks and every SQLite race shard
        env:
          BACKEND_RESULT: ${{ needs.backend-checks.result }}
          SQLITE_RESULT: ${{ needs.sqlite-race.result }}
        run: |
          set -euo pipefail
          test "$BACKEND_RESULT" = success
          test "$SQLITE_RESULT" = success

  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Read the version from go.mod so CI can't drift from the module
          # (it previously pinned 1.22 while go.mod declared 1.25).
          go-version-file: backend/go.mod
          cache: false

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test backend packages outside the SQLite race matrix
        shell: bash
        run: |
          set -euo pipefail
          sqlite_package=$(go list ./internal/storage/sqlite)
          package_list=$(go list ./...)
          mapfile -t packages <<< "$package_list"
          other_packages=()
          sqlite_count=0
          for package in "${packages[@]}"; do
            if [[ "$package" == "$sqlite_package" ]]; then
              sqlite_count=$((sqlite_count + 1))
            else
              other_packages+=("$package")
            fi
          done
          test "$sqlite_count" -eq 1
          test "${#other_packages[@]}" -gt 0
          go test -race -timeout=20m "${other_packages[@]}"

  sqlite-race:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Partition every discovered SQLite test exactly once
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          go test -race -p=1 -parallel=1 -timeout=2m -list '^(Test|Example|Fuzz)' ./internal/storage/sqlite > sqlite-test-list.txt
          python3 - <<'PY'
          from collections import Counter
          import json
          import os
          from pathlib import Path
          import re

          lines = Path("sqlite-test-list.txt").read_text().splitlines()
          names = sorted(line for line in lines if re.fullmatch(r"(?:Test|Example|Fuzz)\w*", line))
          shards = [names[index::4] for index in range(4)]
          counts = Counter(name for shard in shards for name in shard)
          unmatched = sorted(set(names) - counts.keys())
          overlaps = sorted(name for name, count in counts.items() if count != 1)
          report = {"names": names, "shards": shards, "unmatched": unmatched, "overlaps": overlaps}
          Path("sqlite-partition.json").write_text(json.dumps(report, indent=2) + "\n")
          assert names and all(shards), "empty SQLite inventory or shard"
          assert not unmatched and not overlaps, "SQLite partition is not exhaustive and disjoint"
          selected = shards[int(os.environ["SHARD"])]
          Path("sqlite-run-pattern.txt").write_text("^(" + "|".join(selected) + ")$")
          print(f"SQLite shard {os.environ['SHARD']}: {len(selected)}/{len(names)} top-level cases")
          PY

      - name: Run SQLite race shard and verify nonzero complete execution
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          go test -race -p=1 -parallel=1 -count=1 -timeout=20m -json -run "$(cat sqlite-run-pattern.txt)" ./internal/storage/sqlite | tee sqlite-results.jsonl
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("sqlite-partition.json").read_text())
          selected = report["shards"][int(os.environ["SHARD"])]
          events = [json.loads(line) for line in Path("sqlite-results.jsonl").read_text().splitlines()]
          executed = [event["Test"] for event in events if event["Action"] == "run" and "/" not in event.get("Test", "/")]
          missing = sorted(set(selected) - set(executed))
          unexpected = sorted(set(executed) - set(selected))
          report.update(executed=executed, missing=missing, unexpected=unexpected)
          Path("sqlite-partition.json").write_text(json.dumps(report, indent=2) + "\n")
          assert executed and not missing and not unexpected, "SQLite shard execution differs from selection"
          PY

      - name: Preserve SQLite selection and execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-race-${{ matrix.shard }}
          path: |
            backend/sqlite-test-list.txt
            backend/sqlite-partition.json
            backend/sqlite-run-pattern.txt
            backend/sqlite-results.jsonl
          if-no-files-found: error

  # The suite above only ever runs on Linux, so the packages whose behaviour is
  # genuinely platform-specific have never been exercised on Windows: worktree
  # teardown renames and unlinks directories, and Windows is the platform where
  # an open handle makes both fail. Scoped to those packages rather than the
  # whole suite to keep the matrix cheap.
  windows-workspace:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false

      # Scoped to teardown and kill by name rather than running these packages
      # whole: running them on Windows for the first time surfaced ten
      # pre-existing failures (agent switching, handoff artifacts, spawn PATH
      # and branch namespacing) that have nothing to do with worktree teardown.
      # Widening this is worth doing, but as its own change with its own fixes.
      - name: Test SQLite filesystem path identity
        run: go test -race -run 'Test(OpenPreservesDataDirectoryCharacters|FragmentPathsKeepDatabasesIsolated|OpenRefusesToHideLegacyDatabase|OpenPrefersExistingIntendedDatabase|DatabaseURIPreservesWindowsPaths)$' ./internal/storage/sqlite

      - name: Test workspace teardown and session kill
        run: go test -race -v -run 'Destroy|Discard|Sweep|Kill' ./internal/adapters/workspace/... ./internal/session_manager/

      - name: Test Windows Chat environment precedence
        run: go test -race ./internal/adapters/chatdriver/processenv/ ./internal/agentlaunch/

      - name: Test Windows background agent commands have no console
        run: go test -race -run '^TestBackgroundCommandHasNoConsole$' ./internal/adapters/agent/pi ./internal/adapters/agent/omp ./internal/adapters/agent/primeagent
      - name: Test Windows mobile tunnel subprocesses
        run: go test -race -run 'Cloudflared|Tunnel|Command' ./internal/mobilebridge/ ./internal/process/

      - name: Test native Goose identity
        run: go test -race -count=1 -timeout=10m ./internal/adapters/agent/binaryutil ./internal/adapters/agent/goose

      - name: Test Goose readiness and inventory
        run: go test -race -count=1 -timeout=10m -run '^Test(FindInstalledBinary|WarmReadinessAndFindInstalled|PresslyGoose|Refresh|Probe|ReadinessCoordinator)' ./internal/service/agent

  windows-journal:
    runs-on: windows-latest
    # Time/concurrency bounds do not enforce child-process or memory quotas.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Test native Windows ACP prompt journals
        run: >-
          go test -v -count=1 -p=1 -parallel=1 -timeout=5m
          -run '^(TestACPPromptJournalReplaysResetsAndEnforcesQuota|TestACPPromptJournalWindowsDACLConfidentiality|TestACPPromptJournalWindowsRetainedReaderBlocksOpen|TestACPPromptJournalWindowsSecurityFailureReturnsNoJournal)$'
          ./internal/adapters/chatdriver/persistenthost

  cloud-build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: cloud/go.mod
          cache: false

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: golangci-lint
        # v8 of the action drives golangci-lint v2 (the schema this config uses);
        # the v6 action speaks v1 CLI flags and errors against a v2 binary.
        uses: golangci/golangci-lint-action@v8
        with:
          # Pinned for reproducibility: bump intentionally rather than letting an
          # upstream release change CI. Must be built with Go >= the module's
          # (go.mod is 1.25); v2.12.2 is built with go1.25 — older v2 tags
          # (e.g. v2.1.x) are built with go1.24 and refuse to analyze 1.25 code.
          version: v2.12.2
          working-directory: backend
          # Blocking on the full ruleset: the tree is clean at zero findings, so
          # any new issue fails CI rather than being grandfathered.

  sqlc-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Regenerate storage queries with pinned sqlc
        run: npm run sqlc

      - name: Check for generated storage drift
        run: |
          git diff --exit-code -- backend/internal/storage/sqlite/gen
          test -z "$(git ls-files --others --exclude-standard -- backend/internal/storage/sqlite/gen)"

  api-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Regenerate API spec and TS types
        run: npm run api

      # openapi.yaml drift is already caught by TestBuild_MatchesEmbedded in
      # the build-test job (go test -race ./...). Only schema.ts needs checking here.
      - name: Check for schema.ts drift
        run: git diff --exit-code -- frontend/src/api/schema.ts
